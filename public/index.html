<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Página inicial</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: system-ui, sans-serif; background: #111; color: #eee;
    }
    @media (prefers-color-scheme: light) { body { background: #f4f4f4; color: #111; } }
    main { text-align: center; padding: 16px; }
    #status { opacity: .7; }
  </style>
</head>
<body>
  <main>
    <h1>Página inicial</h1>
    <p id="status">Verificando servidor…</p>
  </main>
  <script>
    fetch('/api/health')
      .then(r => r.json())
      .then(d => { document.getElementById('status').textContent = d.ok ? 'Servidor OK ✅' : 'Servidor com erro ❌'; })
      .catch(() => { document.getElementById('status').textContent = 'Servidor fora do ar ❌'; });
  </script>
</body>
</html>
