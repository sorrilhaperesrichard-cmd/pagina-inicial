<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Página inicial</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: system-ui, sans-serif; background: #111; color: #eee;
    }
    @media (prefers-color-scheme: light) { body { background: #f4f4f4; color: #111; } }
    main { text-align: center; padding: 16px; }
    img { width: 64px; height: 64px; border-radius: 50%; }
    a.btn, button {
      display: inline-block; margin-top: 12px; padding: 10px 18px; border-radius: 8px;
      border: 1px solid currentColor; background: none; color: inherit; font: inherit;
      text-decoration: none; cursor: pointer;
    }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <h1>Página inicial</h1>
    <p id="loading">Carregando…</p>
    <div id="out" hidden>
      <a class="btn" href="/api/auth/github/login">Entrar com GitHub</a>
    </div>
    <div id="in" hidden>
      <img id="avatar" alt="">
      <p>Olá, <strong id="name"></strong></p>
      <button id="logout">Sair</button>
    </div>
  </main>
  <script>
    const $ = id => document.getElementById(id);
    fetch('/api/me').then(async r => {
      $('loading').hidden = true;
      if (!r.ok) { $('out').hidden = false; return; }
      const u = await r.json();
      $('name').textContent = u.name;
      $('avatar').src = u.avatar_url;
      $('in').hidden = false;
    }).catch(() => { $('loading').textContent = 'Servidor fora do ar ❌'; });
    $('logout').onclick = () => fetch('/api/auth/logout', { method: 'POST' }).then(() => location.reload());
  </script>
</body>
</html>
